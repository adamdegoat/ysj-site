<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YSJ — Prospect Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/*
=== SUPABASE SQL SETUP (run once in Supabase SQL Editor) ===

create table if not exists prospects (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  phone text,
  email text,
  source text default 'referral',
  stage text default 'new_lead',
  qualification int default 0,
  product_interest text,
  next_followup date,
  next_appointment timestamptz,
  appointment_location text,
  conversion_product text,
  conversion_value numeric,
  notes text,
  created_at timestamptz default now(),
  updated_at timestamptz default now()
);

create table if not exists interactions (
  id uuid primary key default gen_random_uuid(),
  prospect_id uuid references prospects(id) on delete cascade,
  type text not null,
  notes text,
  created_at timestamptz default now()
);

alter table prospects enable row level security;
alter table interactions enable row level security;
create policy "open" on prospects for all using (true) with check (true);
create policy "open" on interactions for all using (true) with check (true);
*/
:root {
  --navy:#0f2342; --navy2:#1a3a6e; --blue:#2563eb; --blue2:#3b82f6;
  --bg:#f0f4f8; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --green:#16a34a; --red:#dc2626; --orange:#ea580c; --yellow:#ca8a04;
  --green-bg:#f0fdf4; --red-bg:#fef2f2; --orange-bg:#fff7ed; --yellow-bg:#fefce8;
  --sidebar:252px; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#eef2f7;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle,rgba(37,99,235,.055) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3,.section-title,.stat-card .value,.sidebar-logo h2{font-family:'Plus Jakarta Sans',sans-serif}
.hidden{display:none!important}
a{color:var(--blue);text-decoration:none}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0b1d3a 0%,#0f2342 40%,#132b52 100%);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.sidebar-logo{padding:1.5rem 1.4rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sidebar-logo-text h2{color:#fff;font-size:1.35rem;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#fff 0%,#93c5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-logo-text p{color:rgba(255,255,255,.4);font-size:10px;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
.sidebar-nav{flex:1;padding:1rem .75rem;overflow-y:auto}
.nav-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1px;padding:.5rem 1rem .3rem;margin-top:.5rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:.72rem 1rem;color:rgba(255,255,255,.55);cursor:pointer;transition:all .18s;font-weight:500;font-size:13px;border-radius:8px;margin-bottom:2px}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.09)}
.nav-item.active{color:#fff;background:rgba(59,130,246,.22);border:1px solid rgba(59,130,246,.28);box-shadow:0 2px 12px rgba(59,130,246,.2);position:relative}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:linear-gradient(180deg,#60a5fa,#3b82f6);border-radius:0 3px 3px 0}
.nav-item svg{flex-shrink:0;width:16px;height:16px}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif}
.sidebar-footer{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,.07)}
.main{margin-left:var(--sidebar);min-height:100vh;flex:1}
.main-header{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.7);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 12px rgba(0,0,0,.06)}
.main-header h1{font-size:1.15rem;font-weight:700;color:var(--text)}
.content{padding:1.75rem 2rem}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#0b1d3a,#0f2342);z-index:200;padding:.5rem 0 max(.25rem,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.bottom-nav-items{display:flex;justify-content:space-around}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.5);cursor:pointer;font-size:10px;padding:.4rem .5rem;border-radius:8px;transition:all .15s;flex:1;min-width:0;position:relative}
.bottom-nav-item.active{color:#93c5fd}
.bottom-nav-item:active{background:rgba(255,255,255,.08)}
.bottom-nav-item svg{width:20px;height:20px}
.bnav-badge{position:absolute;top:2px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px}
#more-drawer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#0f2342,#0b1d3a);z-index:300;border-radius:20px 20px 0 0;padding:1rem 1.5rem max(1.5rem,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.4)}
#more-drawer.open{transform:translateY(0)}
#more-drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;display:none}
#more-drawer-backdrop.open{display:block}
.drawer-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 1.25rem}
.drawer-item{display:flex;align-items:center;gap:.85rem;padding:.9rem .5rem;color:rgba(255,255,255,.7);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;font-weight:500}
.drawer-item:last-child{border-bottom:none}
.drawer-item svg{width:20px;height:20px;color:rgba(255,255,255,.5)}
.drawer-item:active{background:rgba(255,255,255,.06);border-radius:8px}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .main-header{padding:.75rem 1rem}
  .main-header h1{font-size:1rem}
  #header-action .btn{padding:7px 12px;font-size:12px}
  .content{padding:1rem 1rem 5.5rem}
  .bottom-nav{display:block}
  .stats-grid{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr!important}
  .modal{max-height:95vh;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-width:100%}
  #modal-overlay{align-items:flex-end;padding:0}
  .detail-header{flex-direction:column;gap:.85rem}
  .detail-actions{margin-top:.5rem}
  .prospect-card{flex-wrap:wrap}
  .pc-right{width:100%;display:flex;align-items:center;gap:.75rem;justify-content:flex-start;margin-top:.25rem}
  .pc-right .pc-touches,.pc-right div{text-align:left}
  .log-btns{gap:.4rem}
  .log-btn{padding:6px 10px;font-size:11px}
  .pipeline-stage-header{padding:.7rem 1rem}
  .pipeline-stage-body{padding:.5rem 1rem}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-card{padding:1rem}
  .stat-card .value{font-size:1.5rem}
  .stat-card .sc-icon{display:none}
  .badge{font-size:10px;padding:2px 6px}
  .card{padding:1rem}
}

/* FADE */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp .22s ease both}

/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border-radius:12px;padding:1.35rem 1.4rem 1.2rem;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.stat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.1);transform:translateY(-2px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue2);border-radius:12px 12px 0 0}
.stat-card.green{background:linear-gradient(145deg,#f0fdf4,#f8fffe);border-color:#bbf7d0}
.stat-card.green::before{background:linear-gradient(90deg,#16a34a,#22c55e)}
.stat-card.red{background:linear-gradient(145deg,#fef2f2,#fff8f8);border-color:#fecaca}
.stat-card.red::before{background:linear-gradient(90deg,#dc2626,#ef4444)}
.stat-card.orange{background:linear-gradient(145deg,#fff7ed,#fffbf6);border-color:#fed7aa}
.stat-card.orange::before{background:linear-gradient(90deg,#ea580c,#f97316)}
.stat-card.yellow{background:linear-gradient(145deg,#fefce8,#fffef5);border-color:#fde68a}
.stat-card.yellow::before{background:linear-gradient(90deg,#ca8a04,#eab308)}
.stat-card .sc-icon{position:absolute;right:1rem;top:50%;transform:translateY(-50%);opacity:.08;pointer-events:none}
.stat-card .sc-icon svg{width:52px;height:52px}
.stat-card .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:.5rem}
.stat-card.red .label{color:#b91c1c}
.stat-card.orange .label{color:#c2410c}
.stat-card.green .label{color:#15803d}
.stat-card.yellow .label{color:#a16207}
.stat-card .value{font-size:2rem;font-weight:800;color:var(--navy);line-height:1}
.stat-card.red .value{color:#dc2626}
.stat-card.orange .value{color:#ea580c}
.stat-card.green .value{color:#16a34a}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:5px}
.stat-card.accent{background:linear-gradient(135deg,#0f2342 0%,#1a3a6e 100%);border-color:#1a3a6e}
.stat-card.accent::before{background:rgba(255,255,255,.2)}
.stat-card.accent .label,.stat-card.accent .sub{color:rgba(255,255,255,.6)}
.stat-card.accent .value{color:#fff}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1.4rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 6px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.08)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.85rem;border-bottom:1px solid var(--border)}
.card-title{font-size:14px;font-weight:700;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:.4rem}
.section-title{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:1rem;font-family:'Plus Jakarta Sans',sans-serif}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-orange{background:var(--orange-bg);color:var(--orange)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge-blue{background:#eff6ff;color:var(--blue)}
.badge-gray{background:#f1f5f9;color:var(--muted)}
.badge-purple{background:#f5f3ff;color:#7c3aed}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
tbody tr:nth-child(even) td{background:#f8fafc}
tr:hover td{background:#eff6ff!important}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state svg{width:40px;height:40px;color:var(--muted2);margin:0 auto .75rem;display:block}
.empty-state p{font-size:14px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .18s;letter-spacing:.1px}
.btn-primary{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 100%);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.btn-primary:hover{background:linear-gradient(135deg,#1e40af 0%,#1d4ed8 100%);box-shadow:0 4px 14px rgba(37,99,235,.45);transform:translateY(-1px)}
.btn-secondary{background:var(--card);color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff}
.btn-danger:hover{opacity:.88;transform:translateY(-1px)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-full{width:100%}

/* FORMS */
.form-group{margin-bottom:1.1rem}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:14px;outline:none;transition:border .2s;background:var(--card)}
input:focus,select:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:10}
.modal-header h3{font-size:16px;font-weight:700;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif}
.modal-body{padding:1.5rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:.75rem;justify-content:flex-end}
.close-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;transition:all .15s}
.close-btn:hover{background:var(--bg);color:var(--text)}

/* PROSPECT CARDS */
.prospect-list{display:flex;flex-direction:column;gap:.65rem}
.prospect-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1rem 1.2rem;box-shadow:0 1px 3px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:1rem;border-left:4px solid var(--border)}
.prospect-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);transform:translateY(-2px)}
.prospect-card.overdue{border-left-color:var(--red);background:linear-gradient(135deg,#fff8f8,#fff)}
.prospect-card.overdue:hover{border-left-color:var(--red);box-shadow:0 4px 16px rgba(220,38,38,.12),0 8px 24px rgba(0,0,0,.06)}
.prospect-card.due-today{border-left-color:var(--orange);background:linear-gradient(135deg,#fffbf6,#fff)}
.prospect-card.due-today:hover{box-shadow:0 4px 16px rgba(234,88,12,.12),0 8px 24px rgba(0,0,0,.06)}
.prospect-card.on-track{border-left-color:#cbd5e1}
.pc-avatar{flex-shrink:0}
.pc-main{flex:1;min-width:0}
.pc-name{font-weight:700;font-size:14px;color:var(--navy);margin-bottom:3px;font-family:'Plus Jakarta Sans',sans-serif}
.pc-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pc-right{text-align:right;flex-shrink:0}
.pc-touches{font-size:12px;color:var(--muted);margin-bottom:4px}
.pc-touches strong{color:var(--navy);font-weight:700}

/* HEAT PILL */
.heat-hot{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
.heat-warm{background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
.heat-cold{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}

/* PIPELINE STAGES */
.pipeline-board{display:flex;flex-direction:column;gap:.85rem}
.pipeline-stage{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04)}
.pipeline-stage-header{padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.06)}
.pipeline-stage-header.new_lead{background:linear-gradient(135deg,#f8fafc,#f1f5f9)}
.pipeline-stage-header.contacted{background:linear-gradient(135deg,#eff6ff,#dbeafe)}
.pipeline-stage-header.needs_analysis{background:linear-gradient(135deg,#f5f3ff,#ede9fe)}
.pipeline-stage-header.proposal_sent{background:linear-gradient(135deg,#fff7ed,#ffedd5)}
.pipeline-stage-header.followup{background:linear-gradient(135deg,#fefce8,#fef9c3)}
.pipeline-stage-header.won{background:linear-gradient(135deg,#f0fdf4,#dcfce7)}
.pipeline-stage-header.cold{background:linear-gradient(135deg,#f8fafc,#f1f5f9)}
.pipeline-stage-name{font-weight:700;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif}
.pipeline-stage-count{font-size:12px;color:var(--muted)}
.pipeline-stage-body{padding:.75rem 1.2rem}
.pipeline-prospect-row{display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.pipeline-prospect-row:last-child{border-bottom:none}
.pipeline-prospect-row:hover .ppr-name{color:var(--blue)}
.ppr-name{font-weight:600;font-size:13px;flex:1}
.ppr-meta{font-size:11px;color:var(--muted)}

/* INTERACTION TIMELINE */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:.85rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.tl-icon.call{background:#eff6ff;color:#2563eb}
.tl-icon.meet{background:#f0fdf4;color:#16a34a}
.tl-icon.whatsapp{background:#f0fdf4;color:#16a34a}
.tl-icon.email{background:#faf5ff;color:#7c3aed}
.tl-icon.no_reply{background:#fef2f2;color:#dc2626}
.tl-body{flex:1}
.tl-type{font-weight:600;font-size:13px;text-transform:capitalize}
.tl-notes{font-size:13px;color:var(--muted);margin-top:2px}
.tl-date{font-size:11px;color:var(--muted2);margin-top:3px}

/* DETAIL PAGE */
.detail-header{background:linear-gradient(135deg,#f8faff,#fff);border-radius:14px;border:1px solid #dbeafe;padding:1.5rem;margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:1.25rem;box-shadow:0 2px 8px rgba(37,99,235,.08),0 4px 20px rgba(0,0,0,.05)}
.detail-name{font-size:1.4rem;font-weight:800;color:var(--navy)}
.detail-meta{font-size:13px;color:var(--muted);margin-top:4px}
.detail-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.qual-dots{display:flex;gap:4px;align-items:center}
.qual-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.qual-dot.filled{background:var(--blue2)}

/* QUICK LOG BUTTONS */
.log-btns{display:flex;gap:.5rem;flex-wrap:wrap}
.log-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif}
.log-btn.call{border-color:#2563eb;color:#2563eb;background:#eff6ff}
.log-btn.call:hover{background:#2563eb;color:#fff}
.log-btn.meet{border-color:#16a34a;color:#16a34a;background:#f0fdf4}

<script>
const SUPABASE_URL = 'https://dsdhofawlzjejcewdrzx.supabase.co'
const SUPABASE_KEY = 'sb_publishable_BB6CCof51fIN5uTwMT3oPg_QA5m8PQe'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const STAGES = {
  new_lead:       { label:'New Lead',       color:'#64748b', bg:'#f1f5f9' },
  contacted:      { label:'Contacted',      color:'#2563eb', bg:'#eff6ff' },
  needs_analysis: { label:'Needs Analysis', color:'#7c3aed', bg:'#f5f3ff' },
  proposal_sent:  { label:'Proposal Sent',  color:'#ea580c', bg:'#fff7ed' },
  followup:       { label:'Follow-Up',      color:'#ca8a04', bg:'#fefce8' },
  won:            { label:'Won',            color:'#16a34a', bg:'#f0fdf4' },
  cold:           { label:'Cold',           color:'#94a3b8', bg:'#f8fafc' }
}
const STAGE_ORDER = ['new_lead','contacted','needs_analysis','proposal_sent','followup','won','cold']

const SOURCES = {
  referral:    'Referral',
  whatsapp:    'WhatsApp',
  fb:          'FB Ads',
  immigration: 'Immigration',
  cold:        'Cold',
  other:       'Other'
}

const S = { prospects:[], interactions:[], view:'dashboard', prospectId:null }

async function loadAll() {
  const [p, i] = await Promise.all([
    sb.from('prospects').select('*').order('updated_at',{ascending:false}),
    sb.from('interactions').select('*').order('created_at',{ascending:false})
  ])
  S.prospects = p.data || []
  S.interactions = i.data || []
}

function prospectsOf(pid) { return S.interactions.filter(x=>x.prospect_id===pid) }
function touchCount(pid) { return prospectsOf(pid).length }
function lastContact(pid) {
  const i = prospectsOf(pid)
  if(!i.length) return null
  return new Date(i[0].created_at)
}
function heatLabel(pid) {
  const lc = lastContact(pid)
  if(!lc) return 'cold'
  const days = (Date.now() - lc.getTime()) / 86400000
  if(days <= 7) return 'hot'
  if(days <= 30) return 'warm'
  return 'cold'
}
function heatBadge(pid) {
  const h = heatLabel(pid)
  return `<span class="heat-${h}">${h}</span>`
}
function stageBadge(stage) {
  const s = STAGES[stage] || STAGES.new_lead
  return `<span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span>`
}
function sourceBadge(src) {
  const cls = `src-${src||'other'}`
  return `<span class="badge ${cls}">${SOURCES[src]||src||'—'}</span>`
}
function qualBar(q) {
  const dots = Array.from({length:5},(_,i)=>`<span class="qual-dot${i<q?' filled':''}"></span>`).join('')
  return `<div class="qual-dots">${dots}</div>`
}
function avatar(name,size=40) {
  const colors=['#3b82f6','#8b5cf6','#0891b2','#059669','#d97706','#db2777','#7c3aed']
  const c=colors[(name||'A').charCodeAt(0)%colors.length]
  const i=(name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${c}18;border:2px solid ${c}40;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${size*.35}px;color:${c};flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif">${i}</div>`
}
function fmtDate(d) {
  if(!d) return '—'
  return new Date(d).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})
}
function fmtDatetime(d) {
  if(!d) return '—'
  return new Date(d).toLocaleString('en-SG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
}
function daysAgo(d) {
  if(!d) return null
  const days = Math.floor((Date.now()-new Date(d).getTime())/86400000)
  if(days===0) return 'today'
  if(days===1) return 'yesterday'
  return `${days}d ago`
}
function isOverdue(p) {
  if(!p.next_followup) return false
  return new Date(p.next_followup) < new Date(new Date().toDateString())
}
function isDueToday(p) {
  if(!p.next_followup) return false
  return new Date(p.next_followup).toDateString() === new Date().toDateString()
}
function cardClass(p) {
  if(isOverdue(p)) return 'overdue'
  if(isDueToday(p)) return 'due-today'
  return 'on-track'
}
function overdueCount() { return S.prospects.filter(p=>p.stage!=='won'&&p.stage!=='cold'&&isOverdue(p)).length }
function updateBadges() {
  const c = overdueCount()
  const show = c > 0
  document.querySelectorAll('#nav-badge-overdue,#bnav-badge-overdue').forEach(el=>{
    el.textContent = c; el.classList.toggle('hidden',!show)
  })
}

function navigate(view, pid) {
  S.view = view
  S.prospectId = pid || null
  document.querySelectorAll('.nav-item,.bottom-nav-item').forEach(el=>el.classList.remove('active'))
  const navMap = {dashboard:'dashboard',prospects:'prospects',pipeline:'pipeline',analytics:'analytics',calculators:'calculators',guide:'guide'}
  const key = navMap[view]||view
  if(key) {
    const d = document.getElementById(`nav-${key}`)
    const b = document.getElementById(`bnav-${key}`)
    if(d) d.classList.add('active')
    if(b) b.classList.add('active')
  }
  const titles = {dashboard:'Dashboard',prospects:'All Prospects',pipeline:'Pipeline',analytics:'Analytics',calculators:'Calculators',guide:'How to Use',prospect_detail:'Prospect Detail'}
  document.getElementById('page-title').textContent = titles[view]||view
  const el = document.getElementById('main-content')
  el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in')
  renderView()
}

function renderView() {
  const v = S.view
  const ha = document.getElementById('header-action')
  ha.innerHTML = ''
  if(v==='dashboard') renderDashboard()
  else if(v==='prospects') renderProspects()
  else if(v==='pipeline') renderPipeline()
  else if(v==='analytics') renderAnalytics()
  else if(v==='prospect_detail') renderProspectDetail()
  else if(v==='calculators') renderCalculators()
  else if(v==='guide') renderGuide()
}

function renderDashboard() {
  const hour = new Date().getHours()
  const greet = hour<12?'Good morning':'hour'<17?'Good afternoon':'Good evening'
  const today = S.prospects.filter(p=>p.stage!=='won'&&p.stage!=='cold'&&isDueToday(p))
  const overdue = S.prospects.filter(p=>p.stage!=='won'&&p.stage!=='cold'&&isOverdue(p))
  const appts = S.prospects.filter(p=>p.next_appointment&&new Date(p.next_appointment)>new Date()).sort((a,b)=>new Date(a.next_appointment)-new Date(b.next_appointment)).slice(0,3)
  const active = S.prospects.filter(p=>p.stage!=='won'&&p.stage!=='cold').length
  const won = S.prospects.filter(p=>p.stage==='won').length
  const totalTouches = S.interactions.length
  const thisMonth = S.interactions.filter(i=>new Date(i.created_at).getMonth()===new Date().getMonth()).length
  const topProspects = [...S.prospects].filter(p=>p.stage!=='cold').sort((a,b)=>touchCount(b.id)-touchCount(a.id)).slice(0,3)

  document.getElementById('header-action').innerHTML = `<button class="btn btn-primary btn-sm" onclick="openAddProspect()"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Prospect</button>`

  document.getElementById('main-content').innerHTML = `
    <div style="background:linear-gradient(135deg,#0b1d3a 0%,#1a3a6e 60%,#1e4080 100%);border-radius:16px;padding:1.75rem 2rem;margin-bottom:1.5rem;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(11,29,58,.35)">
      <div style="position:absolute;right:-20px;top:-20px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none"></div>
      <div style="position:absolute;right:40px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:rgba(59,130,246,.1);pointer-events:none"></div>
      <div style="position:relative;z-index:1">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.45);margin-bottom:.4rem">${new Date().toLocaleDateString('en-SG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        <div style="font-size:24px;font-weight:800;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:.25rem">${greet}, Shun Jie 👋</div>
        <div style="font-size:13px;color:rgba(255,255,255,.55)">Here's your prospect activity at a glance</div>
        <div style="display:flex;gap:1.5rem;margin-top:1.1rem;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:.4rem"><span style="width:8px;height:8px;border-radius:50%;background:${overdue.length>0?'#ef4444':'#22c55e'};display:inline-block;${overdue.length>0?'box-shadow:0 0 0 3px rgba(239,68,68,.25)':''}"></span><span style="font-size:12px;color:rgba(255,255,255,.7)">${overdue.length} overdue</span></div>
          <div style="display:flex;align-items:center;gap:.4rem"><span style="width:8px;height:8px;border-radius:50%;background:#f97316;display:inline-block"></span><span style="font-size:12px;color:rgba(255,255,255,.7)">${today.length} due today</span></div>
          <div style="display:flex;align-items:center;gap:.4rem"><span style="width:8px;height:8px;border-radius:50%;background:#60a5fa;display:inline-block"></span><span style="font-size:12px;color:rgba(255,255,255,.7)">${active} active prospects</span></div>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card red">
        <div class="sc-icon"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg></div>
        <div class="label">Overdue</div>
        <div class="value">${overdue.length}</div>
        <div class="sub">${overdue.length>0?'Needs attention now':'All clear ✓'}</div>
      </div>
      <div class="stat-card orange">
        <div class="sc-icon"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="label">Due Today</div>
        <div class="value">${today.length}</div>
        <div class="sub">Follow-ups scheduled</div>
      </div>
      <div class="stat-card">
        <div class="sc-icon"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg></div>
        <div class="label">Active Prospects</div>
        <div class="value">${active}</div>
        <div class="sub">${won} converted to client</div>
      </div>
      <div class="stat-card green">
        <div class="sc-icon"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
        <div class="label">Touchpoints / Month</div>
        <div class="value">${thisMonth}</div>
        <div class="sub">${totalTouches} total all time</div>
      </div>
    </div>

    <div class="two-col">
      <div>
        ${overdue.length>0?`
        <div class="card" style="border-left:4px solid var(--red)">
          <div class="card-header"><span class="card-title" style="color:var(--red)">🔴 Overdue Follow-ups</span><span style="font-size:12px;color:var(--muted)">${overdue.length} pending</span></div>
          <div class="today-list">
            ${overdue.map(p=>`
              <div class="today-item overdue" onclick="navigate('prospect_detail','${p.id}')">
                ${avatar(p.name,34)}
                <div style="flex:1;min-width:0">
                  <div class="ti-name">${p.name}</div>
                  <div class="ti-meta">${stageBadge(p.stage)} · was ${fmtDate(p.next_followup)}</div>
                </div>
                <svg width="14" height="14" fill="none" stroke="var(--muted2)" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
              </div>`).join('')}

function renderAnalytics() {
  const srcCounts = {}
  Object.keys(SOURCES).forEach(k=>srcCounts[k]=0)
  S.prospects.forEach(p=>{ srcCounts[p.source]=(srcCounts[p.source]||0)+1 })
  const maxSrc = Math.max(1,...Object.values(srcCounts))

  const wonBySrc = {}
  S.prospects.filter(p=>p.stage==='won').forEach(p=>{ wonBySrc[p.source]=(wonBySrc[p.source]||0)+1 })

  const convRate = S.prospects.length>0?Math.round(S.prospects.filter(p=>p.stage==='won').length/S.prospects.length*100):0
  const avgTouches = S.prospects.length>0?Math.round(S.interactions.length/S.prospects.length*10)/10:0

  const stageFlow = STAGE_ORDER.map(s=>({s,c:S.prospects.filter(p=>p.stage===s).length}))

  const monthlyTouches = {}
  S.interactions.forEach(i=>{
    const m = new Date(i.created_at).toLocaleDateString('en-SG',{month:'short',year:'numeric'})
    monthlyTouches[m]=(monthlyTouches[m]||0)+1
  })

  document.getElementById('main-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card accent">
        <div class="label">Total Prospects</div>
        <div class="value">${S.prospects.length}</div>
        <div class="sub">${S.prospects.filter(p=>p.stage!=='won'&&p.stage!=='cold').length} active</div>
      </div>
      <div class="stat-card green">
        <div class="label">Conversion Rate</div>
        <div class="value">${convRate}%</div>
        <div class="sub">${S.prospects.filter(p=>p.stage==='won').length} won</div>
      </div>
      <div class="stat-card">
        <div class="label">Avg Touchpoints</div>
        <div class="value">${avgTouches}</div>
        <div class="sub">per prospect</div>
      </div>
      <div class="stat-card orange">
        <div class="label">Total Touchpoints</div>
        <div class="value">${S.interactions.length}</div>
        <div class="sub">all time</div>
      </div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-header"><span class="card-title">Prospects by Source</span></div>
        <div class="source-bar">
          ${Object.entries(srcCounts).map(([src,c])=>`
            <div class="sb-row">
              <span class="sb-label">${SOURCES[src]}</span>
              <div class="sb-track"><div class="sb-fill" style="width:${Math.round(c/maxSrc*100)}%"></div></div>
              <span class="sb-count">${c}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Best Converting Sources</span></div>
        ${Object.keys(wonBySrc).length===0?`<div style="color:var(--muted);font-size:13px">No conversions yet</div>`:`
        <table><thead><tr><th>Source</th><th>Prospects</th><th>Won</th><th>Rate</th></tr></thead><tbody>
          ${Object.entries(wonBySrc).sort((a,b)=>b[1]-a[1]).map(([src,w])=>`
            <tr><td>${sourceBadge(src)}</td><td>${srcCounts[src]||0}</td><td style="color:var(--green);font-weight:700">${w}</td><td>${srcCounts[src]?Math.round(w/srcCounts[src]*100):0}%</td></tr>`).join('')}
        </tbody></table>`}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Pipeline Stage Distribution</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.75rem">
        ${stageFlow.map(({s,c})=>{
          const st=STAGES[s]
          const pct=S.prospects.length?Math.round(c/S.prospects.length*100):0
          return `<div style="background:${st.bg};border-radius:8px;padding:.85rem;border:1px solid ${st.color}30">
            <div style="font-size:11px;font-weight:700;color:${st.color};text-transform:uppercase;letter-spacing:.5px">${st.label}</div>
            <div style="font-size:1.5rem;font-weight:800;color:var(--navy);margin:.25rem 0;font-family:'Plus Jakarta Sans',sans-serif">${c}</div>
            <div style="font-size:11px;color:var(--muted)">${pct}% of total</div>
          </div>`
        }).join('')}
      </div>
    </div>`
}

async function quickLog(pid, type) {
  const notes = type !== 'no_reply' ? (prompt(`Notes for ${type} (optional):`) || '') : ''
  const { error } = await sb.from('interactions').insert({ prospect_id:pid, type, notes })
  if(error){ alert('Error: '+error.message); return }
  await sb.from('prospects').update({ updated_at:new Date().toISOString() }).eq('id',pid)
  await loadAll()
  navigate('prospect_detail', pid)
}

async function saveProspect(pid) {
  const name = document.getElementById('f-name').value.trim()
  if(!name){ alert('Name is required'); return }
  const data = {
    name,
    phone: document.getElementById('f-phone').value.trim()||null,
    email: document.getElementById('f-email').value.trim()||null,
    source: document.getElementById('f-source').value,
    stage: document.getElementById('f-stage').value,
    qualification: parseInt(document.getElementById('f-qual').value)||0,
    product_interest: document.getElementById('f-product').value.trim()||null,
    next_followup: document.getElementById('f-followup').value||null,
    next_appointment: document.getElementById('f-appt').value||null,
    appointment_location: document.getElementById('f-appt-loc').value.trim()||null,
    conversion_product: document.getElementById('f-conv-prod')?.value.trim()||null,
    conversion_value: parseFloat(document.getElementById('f-conv-val')?.value)||null,
    notes: document.getElementById('f-notes').value.trim()||null,
    updated_at: new Date().toISOString()
  }
  let error
  if(pid) {
    const r = await sb.from('prospects').update(data).eq('id',pid)
    error = r.error
  } else {
    const r = await sb.from('prospects').insert(data)
    error = r.error
  }
  if(error){ alert('Error: '+error.message); return }
  closeModal()
  await loadAll()
  updateBadges()
  if(pid) navigate('prospect_detail', pid)
  else navigate('prospects')
}

async function deleteProspect(pid) {
  if(!confirm('Delete this prospect? This cannot be undone.')) return
  const { error } = await sb.from('prospects').delete().eq('id',pid)
  if(error){ alert('Error: '+error.message); return }
  closeModal()
  await loadAll()
  updateBadges()
  navigate('prospects')
}

function calcProtection() {
  const inc=parseFloat(document.getElementById('c1').value)||0
  const yrs=parseFloat(document.getElementById('c2').value)||0
  const debt=parseFloat(document.getElementById('c3').value)||0
  const existing=parseFloat(document.getElementById('c4').value)||0
  const need = inc*yrs + debt - existing
  if(!inc||!yrs) return
  document.getElementById('calc-out').innerHTML = `
    <div class="calc-result">
      <div class="r-label">Recommended Coverage Gap</div>
      <div class="r-value">$${Math.max(0,need).toLocaleString()}</div>
      <div class="r-note">Income replacement: $${(inc*yrs).toLocaleString()} + Debts: $${debt.toLocaleString()} − Existing: $${existing.toLocaleString()}</div>
    </div>`
}
function calcRetirement() {
  const age=parseFloat(document.getElementById('r1').value)||0
  const ret=parseFloat(document.getElementById('r2').value)||65
  const monthly=parseFloat(document.getElementById('r3').value)||0
  const savings=parseFloat(document.getElementById('r4').value)||0
  const yrsLeft=ret-age; const yrsRet=25
  if(!age||!monthly) return
  const need=monthly*12*yrsRet
  const gap=Math.max(0,need-savings)
  const monthly_save=yrsLeft>0?Math.round(gap/(yrsLeft*12)):0
  document.getElementById('calc-out').innerHTML = `
    <div class="calc-result">
      <div class="r-label">Retirement Nest Egg Needed</div>
      <div class="r-value">$${need.toLocaleString()}</div>
      <div class="r-note">Gap: $${gap.toLocaleString()} · Save $${monthly_save.toLocaleString()}/month for ${yrsLeft} years to close the gap</div>
    </div>`
}
function calcCPF() {
  const topup=parseFloat(document.getElementById('p1').value)||0
  const yrs=parseFloat(document.getElementById('p2').value)||0
  if(!topup||!yrs) return
  const taxRelief=Math.min(topup,8000)*0.22
  const growth=topup*yrs*1.04
  document.getElementById('calc-out').innerHTML = `
    <div class="calc-result">
      <div class="r-label">Estimated Tax Savings (22% bracket)</div>
      <div class="r-value">$${Math.round(taxRelief).toLocaleString()}/yr</div>
      <div class="r-note">CPF SA earns ~4% p.a. · Projected SA balance from topup: ~$${Math.round(growth).toLocaleString()} in ${yrs} years</div>
    </div>`
}
function calcEducation() {
  const cAge=parseFloat(document.getElementById('e1').value)||0
  const target=parseFloat(document.getElementById('e2').value)||0
  const current=parseFloat(document.getElementById('e3').value)||0
  const yrs=Math.max(1,18-cAge)
  const gap=Math.max(0,target-current)
  const monthly=Math.round(gap/(yrs*12))
  if(!target) return
  document.getElementById('calc-out').innerHTML = `
    <div class="calc-result">
      <div class="r-label">Monthly Savings Needed</div>
      <div class="r-value">$${monthly.toLocaleString()}/month</div>
      <div class="r-note">Gap: $${gap.toLocaleString()} · ${yrs} years until university</div>
    </div>`
}

function showModal(html) {
  document.getElementById('modal-box').innerHTML = html
  document.getElementById('modal-overlay').classList.remove('hidden')
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden')
}
function handleOverlayClick(e) {
  if(e.target===document.getElementById('modal-overlay')) closeModal()
}
function openMoreDrawer() {

}
function closeMoreDrawer() {
  document.getElementById('more-drawer').classList.remove('open')

}
