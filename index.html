<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YSJ — Client Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy:#0f2342; --navy2:#1a3a6e; --blue:#2563eb; --blue2:#3b82f6;
  --bg:#f0f4f8; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --green:#16a34a; --red:#dc2626; --orange:#ea580c; --yellow:#ca8a04;
  --green-bg:#f0fdf4; --red-bg:#fef2f2; --orange-bg:#fff7ed; --yellow-bg:#fefce8;
  --sidebar:248px; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.section-title,.detail-name,.stat-card .value,.sidebar-logo h2{font-family:'Plus Jakarta Sans',sans-serif}
.hidden{display:none!important}
a{color:var(--blue);text-decoration:none}

/* AUTH */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%)}
.auth-card{background:var(--card);border-radius:12px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.auth-logo{text-align:center;margin-bottom:2rem}
.auth-logo h1{font-size:2rem;font-weight:700;color:var(--navy);letter-spacing:2px}
.auth-logo p{color:var(--muted);font-size:13px;margin-top:4px}
.auth-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.auth-card input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:14px;outline:none;transition:border .2s}
.auth-card input:focus{border-color:var(--blue2)}
.form-group{margin-bottom:1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .18s;letter-spacing:.1px}
.btn-primary{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 100%);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.btn-primary:hover{background:linear-gradient(135deg,#1e40af 0%,#1d4ed8 100%);box-shadow:0 4px 14px rgba(37,99,235,.45);transform:translateY(-1px)}
.btn-secondary{background:var(--card);color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:hover{background:var(--bg);border-color:var(--muted2)}
.btn-danger{background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff;box-shadow:0 2px 6px rgba(220,38,38,.3)}
.btn-danger:hover{opacity:.88;transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%}
.auth-note{text-align:center;color:var(--muted);font-size:12px;margin-top:1rem}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:linear-gradient(180deg,#0b1d3a 0%,#0f2342 40%,#132b52 100%);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.sidebar-logo{padding:1.6rem 1.4rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo h2{color:#fff;font-size:1.5rem;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,#fff 0%,#93c5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-logo p{color:rgba(255,255,255,.4);font-size:11px;margin-top:3px;letter-spacing:.5px;text-transform:uppercase}
.sidebar-nav{flex:1;padding:1rem .75rem;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:.72rem 1rem;color:rgba(255,255,255,.55);cursor:pointer;transition:all .18s;font-weight:500;font-size:13px;border-radius:8px;margin-bottom:2px}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.09)}
.nav-item.active{color:#fff;background:rgba(59,130,246,.25);border:1px solid rgba(59,130,246,.3);box-shadow:0 2px 8px rgba(59,130,246,.15)}
.nav-item svg{flex-shrink:0;width:16px;height:16px}
.sidebar-footer{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,.07)}
.main{margin-left:var(--sidebar);min-height:100vh;flex:1}
.main-header{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.main-header h1{font-size:1.2rem;font-weight:700;color:var(--text)}
.content{padding:1.75rem 2rem}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#0b1d3a,#0f2342);z-index:200;padding:.5rem 0 max(.25rem,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.bottom-nav-items{display:flex;justify-content:space-around}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.5);cursor:pointer;font-size:10px;padding:.4rem .5rem;border-radius:8px;transition:all .15s;flex:1;min-width:0}
.bottom-nav-item.active{color:#93c5fd}
.bottom-nav-item:active{background:rgba(255,255,255,.08)}
.bottom-nav-item svg{width:20px;height:20px}
/* More drawer */
#more-drawer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#0f2342,#0b1d3a);z-index:300;border-radius:20px 20px 0 0;padding:1rem 1.5rem max(1.5rem,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.4)}
#more-drawer.open{transform:translateY(0)}
#more-drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;display:none}
#more-drawer-backdrop.open{display:block}
.drawer-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 1.25rem}
.drawer-item{display:flex;align-items:center;gap:.85rem;padding:.9rem .5rem;color:rgba(255,255,255,.7);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;font-weight:500}
.drawer-item:last-child{border-bottom:none}
.drawer-item svg{width:20px;height:20px;color:rgba(255,255,255,.5)}
.drawer-item:active{background:rgba(255,255,255,.06);border-radius:8px}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .main-header{padding:.75rem 1rem}
  .main-header h1{font-size:1rem}
  #header-action .btn{padding:7px 12px;font-size:12px}
  .content{padding:1rem 1rem 5.5rem}
  .bottom-nav{display:block}
  .stats-grid{grid-template-columns:1fr 1fr}
  .clients-grid{grid-template-columns:1fr}
  .pipeline-grid{grid-template-columns:1fr 1fr}
  .life-stage-grid{grid-template-columns:1fr}
  .rates-grid{grid-template-columns:1fr 1fr}
  .modal{max-height:95vh;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-width:100%}
  #modal-overlay{align-items:flex-end;padding:0}
  .profile-grid{grid-template-columns:1fr 1fr}
  .detail-header{flex-direction:column;align-items:flex-start}
}

/* CARDS & STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border-radius:var(--radius);padding:1.35rem 1.25rem;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.05);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--blue2);border-radius:var(--radius) 0 0 var(--radius)}
.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}
.stat-card.orange::before{background:var(--orange)}
.stat-card .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:.5rem}
.stat-card .value{font-size:1.8rem;font-weight:800;color:var(--navy)}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat-card.accent{background:linear-gradient(135deg,#0f2342 0%,#1a3a6e 100%);border-color:#1a3a6e}
.stat-card.accent::before{background:rgba(255,255,255,.3)}
.stat-card.accent .label,.stat-card.accent .sub{color:rgba(255,255,255,.6)}
.stat-card.accent .value{color:#fff}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:1.35rem;margin-bottom:1rem;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-title{font-size:14px;font-weight:700;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}
.section-title{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:1rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-orange{background:var(--orange-bg);color:var(--orange)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge-blue{background:#ebf8ff;color:var(--blue)}
.badge-gray{background:#edf2f7;color:var(--muted)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.65rem 1rem;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#f7f8fa;border-bottom:1px solid var(--border)}
td{padding:.75rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.table-action{color:var(--blue);cursor:pointer;font-size:12px;font-weight:500}
.table-action:hover{text-decoration:underline}

/* CLIENT CARDS */
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.client-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.35rem;cursor:pointer;transition:all .22s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.client-card:hover{border-color:var(--blue2);box-shadow:0 6px 24px rgba(37,99,235,.12);transform:translateY(-2px)}
.client-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:.35rem;font-family:'Plus Jakarta Sans',sans-serif}
.client-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.client-footer{display:flex;align-items:center;justify-content:space-between;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border)}

/* SEARCH & FILTERS */
.toolbar{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:180px}
.search-box input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;outline:none}
.search-box input:focus{border-color:var(--blue2)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted2);width:14px;height:14px}
select.filter{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;background:var(--card);color:var(--text);outline:none;cursor:pointer}

/* FORMS */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;color:var(--text);background:var(--card);outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2)}
.field textarea{resize:vertical;min-height:80px}
.field-prefix{position:relative}
.field-prefix span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-weight:500}
.field-prefix input{padding-left:28px}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 80px rgba(0,0,0,.3)}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-header h3{font-size:15px;font-weight:700;color:var(--navy)}
.modal-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:1.5rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:.75rem;justify-content:flex-end}

/* PIPELINE */
.pipeline-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:900px){.pipeline-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.pipeline-grid{grid-template-columns:1fr}}
.pipeline-col{background:var(--bg);border-radius:var(--radius);padding:.75rem}
.pipeline-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.pipeline-col-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pipeline-count{background:var(--border);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;color:var(--muted)}
.pipeline-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:.85rem;margin-bottom:.5rem;cursor:pointer}
.pipeline-card:hover{border-color:var(--blue2)}
.pipeline-card-name{font-weight:600;font-size:13px;color:var(--navy);margin-bottom:3px}
.pipeline-card-meta{font-size:11px;color:var(--muted)}

/* CALCULATORS */
.calc-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.calc-tab{padding:.6rem 1.1rem;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.calc-tab.active{color:var(--navy);border-bottom-color:var(--blue2);font-weight:600}
.calc-tab:hover{color:var(--text)}
.calc-result{background:var(--navy);color:#fff;border-radius:var(--radius);padding:1.25rem;margin-top:1rem;text-align:center}
.calc-result .result-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.7;margin-bottom:.35rem}
.calc-result .result-value{font-size:1.75rem;font-weight:700}
.calc-result .result-note{font-size:12px;opacity:.75;margin-top:.35rem}

/* REFERENCE */
.ref-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.ref-tab{padding:.6rem 1.1rem;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.ref-tab.active{color:var(--navy);border-bottom-color:var(--blue2);font-weight:600}
.life-stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.life-stage-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.life-stage-title{font-weight:700;color:var(--navy);font-size:13px;margin-bottom:.25rem}
.life-stage-age{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:.5rem}
.life-stage-products{list-style:none;padding:0}
.life-stage-products li{font-size:12px;color:var(--muted);padding:2px 0;padding-left:12px;position:relative}
.life-stage-products li::before{content:"•";position:absolute;left:0;color:var(--blue2)}
.objection-card{border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.75rem;background:var(--card)}
.objection-q{font-weight:700;color:var(--navy);font-size:13px;margin-bottom:.5rem}
.objection-a{font-size:13px;color:var(--muted);line-height:1.6}
.rates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.rate-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.rate-label{font-size:12px;color:var(--muted);margin-bottom:.25rem}
.rate-value{font-size:1.2rem;font-weight:700;color:var(--navy)}
.rate-note{font-size:11px;color:var(--muted2);margin-top:3px}

/* FOCUS LIST */
.focus-item{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--border)}
.focus-item:last-child{border-bottom:none}
.focus-name{font-weight:600;font-size:13px;color:var(--navy)}
.focus-reason{font-size:12px;color:var(--muted);margin-top:1px}
.focus-priority{flex-shrink:0}

/* COVERAGE GAPS */
.gap-item{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem;background:var(--red-bg);border-radius:6px;margin-bottom:.5rem}
.gap-icon{color:var(--red);flex-shrink:0;margin-top:1px}
.gap-text{font-size:13px;color:var(--red);font-weight:500}

/* INTERACTION LOG */
.interaction-item{padding:.75rem 0;border-bottom:1px solid var(--border)}
.interaction-item:last-child{border-bottom:none}
.interaction-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem}
.interaction-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--blue)}
.interaction-date{font-size:11px;color:var(--muted)}
.interaction-notes{font-size:13px;color:var(--text);line-height:1.5}

/* TOAST */
#toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--text);color:#fff;padding:.75rem 1.1rem;border-radius:var(--radius);font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideIn .2s ease}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* DETAIL VIEW */
.detail-back{display:inline-flex;align-items:center;gap:5px;color:var(--blue);cursor:pointer;font-size:13px;font-weight:500;margin-bottom:1.25rem}
.detail-back:hover{text-decoration:underline}
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}
.detail-name{font-size:1.5rem;font-weight:700;color:var(--navy)}
.detail-meta{font-size:13px;color:var(--muted);margin-top:.25rem}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin-bottom:1.25rem}
.profile-item .pi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);margin-bottom:2px}
.profile-item .pi-value{font-size:13px;font-weight:500;color:var(--text)}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.empty-state p{margin-top:.35rem;font-size:13px}

/* LOADING */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;padding:3rem;gap:.75rem;color:var(--muted)}
</style>
</head>
<body>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h2>YSJ</h2>
      <p>Client Management</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" onclick="navigate('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
      <div class="nav-item" onclick="navigate('clients')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

<script>
/*
=== SUPABASE SQL SETUP ===
Run this in your Supabase SQL Editor (Project > SQL Editor > New query):

create table clients (
  id uuid default gen_random_uuid() primary key,
  created_at timestamptz default now(),
  name text not null,
  email text,
  phone text,
  dob date,
  occupation text,
  annual_income numeric,
  marital_status text,
  children integer default 0,
  stage text default 'lead',
  notes text,
  referred_by_name text
);
alter table clients enable row level security;
create policy "open" on clients for all using (true) with check (true);

create table policies (
  id uuid default gen_random_uuid() primary key,
  created_at timestamptz default now(),
  client_id uuid references clients(id) on delete cascade,
  policy_type text not null,
  insurer text,
  policy_number text,
  annual_premium numeric,
  sum_assured numeric,
  start_date date,
  end_date date,
  status text default 'active',
  notes text
);
alter table policies enable row level security;
create policy "open" on policies for all using (true) with check (true);

create table interactions (
  id uuid default gen_random_uuid() primary key,
  created_at timestamptz default now(),
  client_id uuid references clients(id) on delete cascade,
  interaction_type text,
  interaction_date date default current_date,
  notes text not null
);
alter table interactions enable row level security;
create policy "open" on interactions for all using (true) with check (true);

create table tasks (
  id uuid default gen_random_uuid() primary key,
  created_at timestamptz default now(),
  client_id uuid references clients(id) on delete cascade,
  title text not null,
  due_date date,
  completed boolean default false
);
alter table tasks enable row level security;
create policy "open" on tasks for all using (true) with check (true);
*/

const SUPABASE_URL = 'https://dsdhofawlzjejcewdrzx.supabase.co'
const SUPABASE_KEY = 'sb_publishable_BB6CCof51fIN5uTwMT3oPg_QA5m8PQe'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const S = { user: null, clients: [], policies: [], interactions: [], tasks: [], view: 'dashboard', clientId: null }

// ── UTILITIES ────────────────────────────────────────────────

function fmt(date) {
  if (!date) return '—'
  const d = new Date(date)
  return d.toLocaleDateString('en-SG', { day:'2-digit', month:'short', year:'numeric' })
}
function fmtCur(n) {
  if (!n && n !== 0) return '—'
  return 'S$' + Number(n).toLocaleString('en-SG', { minimumFractionDigits: 0, maximumFractionDigits: 0 })
}
function daysUntil(dateStr) {
  if (!dateStr) return null
  return Math.ceil((new Date(dateStr) - new Date()) / 86400000)
}
function daysUntilBirthday(dob) {
  if (!dob) return null
  const now = new Date(), b = new Date(dob)
  let next = new Date(now.getFullYear(), b.getMonth(), b.getDate())
  if (next < now) next.setFullYear(now.getFullYear() + 1)
  return Math.ceil((next - now) / 86400000)
}
function getAge(dob) {
  if (!dob) return null
  const diff = Date.now() - new Date(dob).getTime()
  return Math.floor(diff / (365.25 * 24 * 3600 * 1000))
}
function stageBadge(s) {
  const m = { lead:'badge-yellow', prospect:'badge-blue', active:'badge-green', inactive:'badge-gray' }
  return `<span class="badge ${m[s]||'badge-gray'}">${s||'—'}</span>`
}
function policyTypeName(t) {
  const m = { term_life:'Term Life', whole_life:'Whole Life', ci:'Critical Illness', health:'Health/H&S', endowment:'Endowment', ilp:'ILP', annuity:'Annuity', accident:'Personal Accident' }
  return m[t] || t
}
function expiryBadge(endDate) {
  const d = daysUntil(endDate)
  if (d === null) return '<span class="badge badge-gray">No expiry</span>'
  if (d < 0) return '<span class="badge badge-gray">Expired</span>'
  if (d <= 30) return `<span class="badge badge-red">${d}d</span>`
  if (d <= 90) return `<span class="badge badge-orange">${d}d</span>`
  return `<span class="badge badge-green">${d}d</span>`
}
function clientName(id) {
  const c = S.clients.find(x => x.id === id)
  return c ? c.name : '—'
}
function toast(msg, type='') {
  const el = document.createElement('div')
  el.className = `toast ${type}`
  el.textContent = msg
  document.getElementById('toast-container').appendChild(el)
  setTimeout(() => el.remove(), 3000)
}

// ── DRAWER ───────────────────────────────────────────────────
function openMoreDrawer() {
  document.getElementById('more-drawer').classList.add('open')
  document.getElementById('more-drawer-backdrop').classList.add('open')
}
function closeMoreDrawer() {
  document.getElementById('more-drawer').classList.remove('open')
  document.getElementById('more-drawer-backdrop').classList.remove('open')
}

// ── AUTH ─────────────────────────────────────────────────────
// No login required — private URL access only

// ── DATA ─────────────────────────────────────────────────────

async function loadAll() {
  const [c, p, i, t] = await Promise.all([
    sb.from('clients').select('*').order('name'),
    sb.from('policies').select('*').order('end_date'),
    sb.from('interactions').select('*').order('interaction_date', { ascending: false }),
    sb.from('tasks').select('*').order('due_date')
  ])
  S.clients = c.data || []
  S.policies = p.data || []
  S.interactions = i.data || []
  S.tasks = t.data || []
}

// ── NAVIGATION ───────────────────────────────────────────────

function navigate(view, param = null) {
  S.view = view; S.clientId = param
  document.querySelectorAll('.nav-item,.bottom-nav-item').forEach(el => el.classList.remove('active'))
  document.querySelectorAll(`.nav-item[onclick*="'${view}'"],.bottom-nav-item[onclick*="'${view}'"]`).forEach(el => el.classList.add('active'))
  // For drawer-accessible views, highlight "More" on mobile
  if (['pipeline','reference','guide'].includes(view)) {
    document.querySelectorAll('.bottom-nav-item[onclick*="openMoreDrawer"]').forEach(el => el.classList.add('active'))
  }
  const titles = { dashboard:'Dashboard', clients:'Clients', policies:'Policies', pipeline:'Pipeline', calculators:'Calculators', reference:'Reference', guide:'How to Use YSJ' }
  document.getElementById('view-title').textContent = param ? clientName(param) : (titles[view] || view)
  renderView()
}

function renderView() {
  const el = document.getElementById('view-content')
  const ha = document.getElementById('header-action')
  ha.innerHTML = ''
  if (S.view === 'dashboard')    { el.innerHTML = renderDashboard(); ha.innerHTML = ''; return }
  if (S.view === 'clients')      { if (S.clientId) { el.innerHTML = renderClientDetail(S.clientId) } else { el.innerHTML = renderClients(); ha.innerHTML = `<button class="btn btn-primary" onclick="showClientModal()" style="font-size:13px;padding:9px 18px">＋ Add New Client</button>` } return }
  if (S.view === 'policies')     { el.innerHTML = renderPolicies(); return }
  if (S.view === 'pipeline')     { el.innerHTML = renderPipeline(); return }
  if (S.view === 'calculators')  { el.innerHTML = renderCalculators(); attachCalcListeners(); return }
  if (S.view === 'reference')    { el.innerHTML = renderReference(); return }
  if (S.view === 'guide')        { el.innerHTML = renderGuide(); return }
}

// ── DASHBOARD ────────────────────────────────────────────────

function renderDashboard() {
  const activeClients = S.clients.filter(c => c.stage === 'active').length
  const expiring30 = S.policies.filter(p => p.status === 'active' && daysUntil(p.end_date) !== null && daysUntil(p.end_date) >= 0 && daysUntil(p.end_date) <= 30).length
  const pendingTasks = S.tasks.filter(t => !t.completed).length
  const totalPremium = S.policies.filter(p => p.status === 'active').reduce((s, p) => s + (Number(p.annual_premium) || 0), 0)

  const focusItems = getFocusList()
  const birthdayClients = S.clients.filter(c => { const d = daysUntilBirthday(c.dob); return d !== null && d <= 30 }).sort((a,b) => daysUntilBirthday(a.dob) - daysUntilBirthday(b.dob))
  const recentInteractions = S.interactions.slice(0, 5)

  const now = new Date(); const hour = now.getHours()
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening'
  return `
<div style="background:linear-gradient(135deg,#0f2342 0%,#1a3a6e 100%);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.85rem;box-shadow:0 4px 20px rgba(15,35,66,.25)">
  <div>
    <div style="color:rgba(255,255,255,.6);font-size:13px;margin-bottom:.25rem">${greet} 👋</div>
    <div style="color:#fff;font-size:1.2rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif">Welcome to Shun Jie dashboard</div>
    <div style="color:rgba(255,255,255,.55);font-size:13px;margin-top:.25rem">${S.clients.length} client${S.clients.length!==1?'s':''} in your book · ${S.policies.filter(p=>p.status==='active').length} active polic${S.policies.filter(p=>p.status==='active').length===1?'y':'ies'}</div>
  </div>
  <button class="btn btn-primary" onclick="navigate('clients');setTimeout(()=>showClientModal(),100)" style="background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);font-size:13px;padding:10px 20px">＋ Add New Client</button>
</div>
<div class="stats-grid">
  <div class="stat-card green"><div class="label">Active Clients</div><div class="value">${activeClients}</div><div class="sub">${S.clients.length} total in book</div></div>
  <div class="stat-card ${expiring30>0?'red':''}"><div class="label">Renewals Due (30d)</div><div class="value" style="color:${expiring30>0?'var(--red)':'var(--navy)'}">${expiring30}</div><div class="sub">Policies expiring soon</div></div>
  <div class="stat-card ${pendingTasks>0?'orange':''}"><div class="label">Pending Tasks</div><div class="value" style="color:${pendingTasks>0?'var(--orange)':'var(--navy)'}">${pendingTasks}</div><div class="sub">Follow-ups due</div></div>
  <div class="stat-card accent"><div class="label">Annual Premium Book</div><div class="value">${fmtCur(totalPremium)}</div><div class="sub">Across all active policies</div></div>
</div>
<div class="two-col">
  <div class="card">
    <div class="card-header"><span class="card-title">Weekly Focus List</span><span class="badge badge-blue">${focusItems.length} clients</span></div>
    ${focusItems.length ? focusItems.map(f => `
    <div class="focus-item">
      <div style="flex:1">
        <div class="focus-name" style="cursor:pointer;color:var(--blue)" onclick="navigate('clients','${f.id}')">${f.name}</div>
        <div class="focus-reason">${f.reason}</div>
      </div>
      <div class="focus-priority"><span class="badge ${f.priority==='high'?'badge-red':f.priority==='medium'?'badge-orange':'badge-yellow'}">${f.priority}</span></div>
    </div>`).join('') : '<div class="empty-state"><p>No priority clients this week.</p></div>'}
  </div>
  <div>
    <div class="card">
      <div class="card-header"><span class="card-title">Birthdays This Month</span></div>
      ${birthdayClients.length ? birthdayClients.map(c => `
      <div class="focus-item">
        <div style="flex:1">
          <div class="focus-name" style="cursor:pointer;color:var(--blue)" onclick="navigate('clients','${c.id}')">${c.name}</div>
          <div class="focus-reason">Birthday in ${daysUntilBirthday(c.dob)} days</div>
        </div>
        <span class="badge badge-green">🎂</span>
      </div>`).join('') : '<div class="empty-state"><p>No birthdays this month.</p></div>'}
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Recent Interactions</span></div>
      ${recentInteractions.length ? recentInteractions.map(i => `
      <div class="interaction-item">
        <div class="interaction-header">
          <span class="interaction-type">${i.interaction_type||'note'}</span>
          <span style="color:var(--muted2)">·</span>
          <span style="cursor:pointer;color:var(--blue);font-size:12px;font-weight:500" onclick="navigate('clients','${i.client_id}')">${clientName(i.client_id)}</span>
          <span style="color:var(--muted2)">·</span>
          <span class="interaction-date">${fmt(i.interaction_date)}</span>
        </div>
        <div class="interaction-notes">${i.notes}</div>
      </div>`).join('') : '<div class="empty-state"><p>No interactions yet.</p></div>'}
    </div>
  </div>
</div>`
}

function getFocusList() {
  const items = []
  const today = new Date()
  S.clients.forEach(c => {
    const clientPolicies = S.policies.filter(p => p.client_id === c.id && p.status === 'active')
    const soonest = clientPolicies.filter(p => { const d = daysUntil(p.end_date); return d !== null && d >= 0 && d <= 30 }).sort((a,b) => daysUntil(a.end_date) - daysUntil(b.end_date))
    if (soonest.length) items.push({ id: c.id, name: c.name, reason: `Policy renewal in ${daysUntil(soonest[0].end_date)} days (${policyTypeName(soonest[0].policy_type)})`, priority: 'high' })
    const overdueTasks = S.tasks.filter(t => t.client_id === c.id && !t.completed && t.due_date && new Date(t.due_date) < today)
    if (overdueTasks.length && !soonest.length) items.push({ id: c.id, name: c.name, reason: `${overdueTasks.length} overdue task(s)`, priority: 'medium' })
    const bd = daysUntilBirthday(c.dob)
    if (bd !== null && bd <= 7 && !soonest.length) items.push({ id: c.id, name: c.name, reason: `Birthday in ${bd} day(s)`, priority: 'low' })
  })
  const seen = new Set(); return items.filter(i => { if (seen.has(i.id)) return false; seen.add(i.id); return true }).slice(0, 7)
}

// ── CLIENTS ──────────────────────────────────────────────────

function renderClients() {
  const search = (window._clientSearch || '').toLowerCase()
  const stageFilter = window._clientStage || 'all'
  let list = S.clients
  if (search) list = list.filter(c => c.name.toLowerCase().includes(search) || (c.phone||'').includes(search) || (c.email||'').toLowerCase().includes(search))
  if (stageFilter !== 'all') list = list.filter(c => c.stage === stageFilter)
  return `
<div class="toolbar">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="Search clients…" value="${search}" oninput="window._clientSearch=this.value;renderView()">
  </div>
  <select class="filter" onchange="window._clientStage=this.value;renderView()">
    <option value="all" ${stageFilter==='all'?'selected':''}>All Stages</option>
    <option value="lead" ${stageFilter==='lead'?'selected':''}>Leads</option>
    <option value="prospect" ${stageFilter==='prospect'?'selected':''}>Prospects</option>
    <option value="active" ${stageFilter==='active'?'selected':''}>Active</option>
    <option value="inactive" ${stageFilter==='inactive'?'selected':''}>Inactive</option>
  </select>
</div>
${S.clients.length === 0 ? `<div style="text-align:center;padding:3rem 1rem;background:var(--card);border-radius:14px;border:2px dashed var(--border)">
  <div style="font-size:3rem;margin-bottom:1rem">👥</div>
  <div style="font-size:1.1rem;font-weight:700;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:.5rem">No clients yet</div>
  <div style="color:var(--muted);font-size:13px;margin-bottom:1.5rem">Add your first client to get started. It takes less than a minute.</div>
  <button class="btn btn-primary" onclick="showClientModal()" style="font-size:14px;padding:12px 28px">＋ Add Your First Client</button>
</div>` : list.length ? `<div class="clients-grid">${list.map(c => {
  const cp = S.policies.filter(p => p.client_id === c.id && p.status === 'active')
  const nextRenewal = cp.filter(p=>p.end_date).sort((a,b)=>new Date(a.end_date)-new Date(b.end_date))[0]
  return `<div class="client-card" onclick="navigate('clients','${c.id}')">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.4rem">
      <div class="client-name">${c.name}</div>
      ${stageBadge(c.stage)}
    </div>
    <div class="client-meta">
      ${c.phone ? `<span>📞 ${c.phone}</span>` : ''}
      ${getAge(c.dob) ? `<span>Age ${getAge(c.dob)}</span>` : ''}
    </div>
    <div class="client-footer">
      <span style="font-size:12px;color:var(--muted)">${cp.length} polic${cp.length===1?'y':'ies'}</span>

function getCoverageGaps(c, policies) {
  const gaps = []
  const active = policies.filter(p => p.status === 'active')
  const types = new Set(active.map(p => p.policy_type))
  const age = getAge(c.dob)
  const income = Number(c.annual_income) || 0
  const totalLifeCover = active.filter(p=>['term_life','whole_life'].includes(p.policy_type)).reduce((s,p)=>s+(Number(p.sum_assured)||0),0)

  if (!types.has('term_life') && !types.has('whole_life')) gaps.push('No life cover — client has no term or whole life policy')
  if (!types.has('ci') && age && age > 30) gaps.push('No critical illness cover — recommended for clients over 30')
  if (!types.has('health')) gaps.push('No health/hospitalisation cover — check if company insurance is adequate')
  if (income > 0 && totalLifeCover > 0 && totalLifeCover < income * 10 && (c.children || 0) > 0) gaps.push(`Potentially underinsured — life cover ${fmtCur(totalLifeCover)} vs recommended ${fmtCur(income*10)} (10× income, has dependants)`)
  return gaps
}

async function moveStage(id, stage) {
  if (!stage) return
  const { error } = await sb.from('clients').update({ stage }).eq('id', id)
  if (error) { toast('Error updating stage', 'error'); return }
  S.clients = S.clients.map(c => c.id===id ? {...c, stage} : c)
  renderView(); toast('Stage updated')

function calcLife() {
  const income=+document.getElementById('c-income').value||0, years=+document.getElementById('c-years').value||20
  const liabilities=+document.getElementById('c-liabilities').value||0, existing=+document.getElementById('c-existing').value||0
  const recommended=(income*years)+liabilities-existing
  const el=document.getElementById('calc-result')
  el.innerHTML=`<div class="calc-result"><div class="result-label">Additional Life Cover Needed</div><div class="result-value">${fmtCur(Math.max(0,recommended))}</div><div class="result-note">Based on ${fmtCur(income)}/yr × ${years} yrs + ${fmtCur(liabilities)} liabilities − ${fmtCur(existing)} existing</div></div>${recommended<=0?`<div style="margin-top:.75rem;padding:.75rem;background:var(--green-bg);border-radius:var(--radius);font-size:13px;color:var(--green);font-weight:500">✓ Existing cover appears sufficient</div>`:''}`
}
function calcCI() {
  const income=+document.getElementById('c-ci-income').value||0, existing=+document.getElementById('c-ci-existing').value||0
  const recommended=(income*5)-existing
  document.getElementById('calc-result').innerHTML=`<div class="calc-result"><div class="result-label">Additional CI Cover Needed</div><div class="result-value">${fmtCur(Math.max(0,recommended))}</div><div class="result-note">Target: ${fmtCur(income*5)} (5× income) − ${fmtCur(existing)} existing</div></div>`
}
function calcRetirement() {
  const age=+document.getElementById('c-age').value||35, retire=+document.getElementById('c-retire').value||65
  const monthly=+document.getElementById('c-monthly').value||3000, cpf=+document.getElementById('c-cpf').value||0
  const savings=+document.getElementById('c-savings').value||0
  const gap=Math.max(0,monthly-cpf), yearsRetire=Math.max(0,85-retire), yearsToRetire=Math.max(1,retire-age)
  const totalNeeded=gap*12*yearsRetire, additionalNeeded=Math.max(0,totalNeeded-savings)
  const monthlySave=additionalNeeded/(yearsToRetire*12)
  document.getElementById('calc-result').innerHTML=`<div class="calc-result"><div class="result-label">Total Retirement Savings Needed</div><div class="result-value">${fmtCur(totalNeeded)}</div><div class="result-note">Monthly gap ${fmtCur(gap)} × ${yearsRetire} yrs retirement</div></div><div class="two-col" style="margin-top:.75rem"><div class="stat-card"><div class="label">Additional Savings Needed</div><div class="value" style="font-size:1.25rem">${fmtCur(additionalNeeded)}</div></div><div class="stat-card"><div class="label">Monthly Savings Required</div><div class="value" style="font-size:1.25rem">${fmtCur(Math.ceil(monthlySave))}</div><div class="sub">for next ${yearsToRetire} yrs</div></div></div>`
}
function calcHDB() {
  const loan=+document.getElementById('c-loan').value||0, cover=+document.getElementById('c-hdb-cover').value||0
  const shortfall=Math.max(0,loan-cover)
  const el=document.getElementById('calc-result')
  if(shortfall===0){el.innerHTML=`<div class="calc-result" style="background:var(--green)"><div class="result-label">Coverage Status</div><div class="result-value">✓ Covered</div><div class="result-note">Existing life cover exceeds outstanding loan</div></div>`}
  else{el.innerHTML=`<div class="calc-result"><div class="result-label">Coverage Shortfall</div><div class="result-value">${fmtCur(shortfall)}</div><div class="result-note">Loan ${fmtCur(loan)} − existing cover ${fmtCur(cover)}</div></div>`}
}

  <div class="field"><label>Annual Income (S$)</label><div class="field-prefix"><span>S$</span><input type="number" id="f-income" value="${c?.annual_income||''}" min="0"></div></div>
</div>
<div class="form-row">
  <div class="field"><label>Marital Status</label><select id="f-marital"><option value="">—</option>${['single','married','divorced','widowed'].map(s=>`<option value="${s}" ${c?.marital_status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
  <div class="field"><label>Number of Children</label><input type="number" id="f-children" value="${c?.children||0}" min="0" max="20"></div>
</div>
<div class="form-row">
  <div class="field"><label>Stage</label><select id="f-stage">${['lead','prospect','active','inactive'].map(s=>`<option value="${s}" ${(c?.stage||'lead')===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
  <div class="field"><label>Referred By</label><input type="text" id="f-referred" value="${c?.referred_by_name||''}" placeholder="Name of referrer"></div>
</div>
<div class="field"><label>Notes</label><textarea id="f-notes">${c?.notes||''}</textarea></div>
</div>
<div class="modal-footer">
  ${c?`<button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')">Delete</button><div style="flex:1"></div>`:''}
  <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" onclick="saveClient(${c?`'${c.id}'`:'null'})">Save Client</button>
</div>`)
}

async function saveClient(id) {
  const name = document.getElementById('f-name').value.trim()
  if (!name) { toast('Name is required', 'error'); return }
  const data = {
    name, phone: document.getElementById('f-phone').value.trim()||null,
    email: document.getElementById('f-email').value.trim()||null,
    dob: document.getElementById('f-dob').value||null,
    occupation: document.getElementById('f-occupation').value.trim()||null,
    annual_income: +document.getElementById('f-income').value||null,
    marital_status: document.getElementById('f-marital').value||null,
    children: +document.getElementById('f-children').value||0,
    stage: document.getElementById('f-stage').value,
    referred_by_name: document.getElementById('f-referred').value.trim()||null,
    notes: document.getElementById('f-notes').value.trim()||null
  }
  let error
  if (id) {
    const r = await sb.from('clients').update(data).eq('id', id); error = r.error
    if (!error) S.clients = S.clients.map(c => c.id===id ? {...c,...data} : c)
  } else {
    const r = await sb.from('clients').insert(data).select().single(); error = r.error
    if (!error) S.clients = [...S.clients, r.data].sort((a,b)=>a.name.localeCompare(b.name))
  }
  if (error) { toast('Error saving client: '+error.message, 'error'); return }
  closeModal(); toast('Client saved', 'success')
  if (id && S.clientId===id) renderView()
  else navigate('clients')
}

async function deleteClient(id) {
  if (!confirm('Delete this client and all their data? This cannot be undone.')) return
  const { error } = await sb.from('clients').delete().eq('id', id)
  if (error) { toast('Error deleting client', 'error'); return }
  S.clients = S.clients.filter(c => c.id !== id)
  S.policies = S.policies.filter(p => p.client_id !== id)
  S.interactions = S.interactions.filter(i => i.client_id !== id)
  S.tasks = S.tasks.filter(t => t.client_id !== id)
  closeModal(); toast('Client deleted'); navigate('clients')
}

async function savePolicy(clientId, policyId) {
  const data = {
    client_id: clientId,
    policy_type: document.getElementById('p-type').value,
    insurer: document.getElementById('p-insurer').value.trim()||null,
    policy_number: document.getElementById('p-number').value.trim()||null,
    status: document.getElementById('p-status').value,
    annual_premium: +document.getElementById('p-premium').value||null,
    sum_assured: +document.getElementById('p-assured').value||null,
    start_date: document.getElementById('p-start').value||null,
    end_date: document.getElementById('p-end').value||null,
    notes: document.getElementById('p-notes').value.trim()||null
  }
  let error
  if (policyId) {
    const r = await sb.from('policies').update(data).eq('id', policyId); error = r.error
    if (!error) S.policies = S.policies.map(p => p.id===policyId ? {...p,...data} : p)
  } else {
    const r = await sb.from('policies').insert(data).select().single(); error = r.error
    if (!error) S.policies = [...S.policies, r.data]
  }
  if (error) { toast('Error saving policy: '+error.message, 'error'); return }
  closeModal(); toast('Policy saved', 'success'); renderView()
}

async function deletePolicy(id) {
  if (!confirm('Delete this policy?')) return
  const { error } = await sb.from('policies').delete().eq('id', id)
  if (error) { toast('Error', 'error'); return }
  S.policies = S.policies.filter(p => p.id !== id)
  closeModal(); toast('Policy deleted'); renderView()
}

async function saveInteraction(clientId) {
  const notes = document.getElementById('i-notes').value.trim()
  if (!notes) { toast('Notes required', 'error'); return }
  const data = { client_id: clientId, interaction_type: document.getElementById('i-type').value, interaction_date: document.getElementById('i-date').value, notes }
  const { data: row, error } = await sb.from('interactions').insert(data).select().single()
  if (error) { toast('Error', 'error'); return }
  S.interactions = [row, ...S.interactions]
  closeModal(); toast('Interaction logged', 'success'); renderView()
}

function showTaskModal(clientId) {
  openModal(`
<div class="modal-header"><h3>Add Task</h3><button class="modal-close" onclick="closeModal()">×</button></div>
<div class="modal-body">
<div class="field"><label>Task *</label><input type="text" id="t-title" placeholder="e.g. Follow up on CI proposal"></div>

</div>

  <button class="btn btn-primary" onclick="saveTask('${clientId}')">Add Task</button>
</div>`)
}

async function saveTask(clientId) {
  const title = document.getElementById('t-title').value.trim()
  if (!title) { toast('Task title required', 'error'); return }
  const data = { client_id: clientId, title, due_date: document.getElementById('t-due').value||null, completed: false }
  const { data: row, error } = await sb.from('tasks').insert(data).select().single()
  if (error) { toast('Error', 'error'); return }
  S.tasks = [...S.tasks, row]
  closeModal(); toast('Task added', 'success'); renderView()
}

async function toggleTask(id, completed) {
  const { error } = await sb.from('tasks').update({ completed }).eq('id', id)
  if (error) { toast('Error', 'error'); return }
  S.tasks = S.tasks.map(t => t.id===id ? {...t, completed} : t)
  renderView()
}

async function deleteTask(id) {
  const { error } = await sb.from('tasks').delete().eq('id', id)
  if (error) { toast('Error', 'error'); return }
  S.tasks = S.tasks.filter(t => t.id !== id)
  renderView()
}
